name: Publish quant-cli docker image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Existing CLI version to rebuild for runtime security updates'
        required: true
        type: string

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate security rebuild version
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          test "$IMAGE_VERSION" = "$ACTUAL_VERSION"
          echo "$IMAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: quantcdn/cli
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.image_version }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          file: .docker/quant-cli.Dockerfile
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true
